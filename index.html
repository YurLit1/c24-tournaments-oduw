<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C24 Ігрові турніри</title>
    <style>
        body {
            font: 15px/1.5 system-ui, sans-serif;
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        fieldset {
            margin-bottom: 1.5rem;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin: .4rem 0;
        }

        input, select {
            font: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            font: inherit;
            margin-top: .5rem;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: .3rem;
            text-align: left;
        }

        tr.pick {
            cursor: pointer;
        }

        tr.pick:hover {
            background: #f2f6ff;
        }

        tr.selected {
            background: #dce8ff;
        }

        pre {
            background: #f3f3f3;
            padding: .75rem;
            white-space: pre-wrap;
        }

        .problem {
            color: #a00;
        }
    </style>
</head>
<body>
    <h1>C24 Ігрові турніри</h1>

    <fieldset>
        <legend>Гравець</legend>
        <label>X-User-Id
            <select id="user">
                <option value="u-player1">Гравець 1 (u-player1)</option>
                <option value="u-player2">Гравець 2 (u-player2)</option>
                <option value="u-player3">Гравець 3 (u-player3)</option>
            </select>
        </label>
    </fieldset>

    <fieldset>
        <legend>Турніри</legend>
        <table>
            <thead><tr><th>Гра</th><th>Початок</th><th>Вільно</th><th>Внесок</th></tr></thead>
            <tbody id="tournaments"><tr><td colspan="4">Завантаження…</td></tr></tbody>
        </table>
        <button type="button" id="reload">Оновити список</button>
    </fieldset>

    <fieldset>
        <legend>Реєстрація</legend>
        <form id="register-form">
            <label>Нікнейм (3–32 символи) <input name="nickname" value="neo"></label>
            <button>Зареєструватися</button>
        </form>
    </fieldset>

    <h2>Відповідь</h2>
    <pre id="out">—</pre>

    <script type="module">
        import {call, Problem} from "./api.js";

        const out = document.getElementById("out");
        const body = document.getElementById("tournaments");
        let selected = null;

        const show = (value, isProblem = false) => {
            out.className = isProblem ? "problem" : "";
            out.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        };

        const report = (error) =>
            error instanceof Problem
                ? show({status: error.status, ...error.body}, true)
                : show(`Сервер недоступний: ${error}`, true);

        const money = (minor, currency) => `${(minor / 100).toFixed(2)} ${currency}`;
        const when = (iso, zone) => new Date(iso).toLocaleString("uk-UA", {timeZone: zone || "Europe/Kyiv"});

        async function loadTournaments() {
            try {
                const {data} = await call("GET", "/v1/tournaments");
                body.innerHTML = "";
                for (const t of data?.items ?? []) {
                    const tr = document.createElement("tr");
                    tr.className = "pick" + (t.id === selected ? " selected" : "");
                    for (const text of [t.game, when(t.starts_at, t.time_zone), `${t.available} / ${t.slots}`,
                                        money(t.fee_minor, t.currency)]) {
                        const td = document.createElement("td");
                        td.textContent = text;
                        tr.appendChild(td);
                    }
                    tr.onclick = () => {
                        selected = t.id;
                        for (const row of body.querySelectorAll("tr")) row.classList.remove("selected");
                        tr.classList.add("selected");
                    };
                    body.appendChild(tr);
                }
            } catch (error) {
                body.innerHTML = '<tr><td colspan="4">Не вдалося завантажити</td></tr>';
                report(error);
            }
        }

        document.getElementById("register-form").onsubmit = async (event) => {
            event.preventDefault();
            if (!selected) {
                show("Оберіть турнір у таблиці", true);
                return;
            }
            const form = new FormData(event.target);
            try {
                const reply = await call("POST", "/v1/registrations", {
                    body: {tournament_id: selected, nickname: form.get("nickname")},
                    headers: {"X-User-Id": document.getElementById("user").value},
                });
                show({
                    status: reply.status,
                    location: reply.headers.get("location"),
                    id: reply.data.id,
                    state: reply.data.status,
                    pay_until: when(reply.data.expires_at),
                });
            } catch (error) {
                report(error);
            }
            await loadTournaments();
        };

        document.getElementById("reload").onclick = loadTournaments;
        loadTournaments();
    </script>
</body>
</html>
